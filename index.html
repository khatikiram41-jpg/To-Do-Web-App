<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management Tool</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #222;
            transition: 0.3s;
        }

        body.dark {
            background: #181a1f;
            color: #fff;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        header h1 {
            font-size: 25px;
        }

        #darkMode {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 9px 14px;
            border-radius: 20px;
            cursor: pointer;
        }

        /* Main */
        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        /* Form */
        .task-form {
            background: white;
            padding: 22px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        body.dark .task-form,
        body.dark .task-card,
        body.dark .sidebar {
            background: #24272e;
            color: white;
        }

        .task-form h2 {
            margin-bottom: 15px;
        }

        .input-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 12px;
        }

        input,
        select {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            width: 100%;
        }

        input:focus,
        select:focus {
            border-color: #4f46e5;
        }

        .add-btn {
            margin-top: 15px;
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .add-btn:hover {
            background: #3730a3;
        }

        /* Layout */
        .content {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 20px;
        }

        /* Sidebar */
        .sidebar {
            background: white;
            padding: 18px;
            border-radius: 15px;
            height: fit-content;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .sidebar h3 {
            margin-bottom: 12px;
        }

        .filter-btn {
            width: 100%;
            text-align: left;
            padding: 11px;
            margin: 5px 0;
            border: none;
            background: transparent;
            border-radius: 8px;
            cursor: pointer;
            color: inherit;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: #4f46e5;
            color: white;
        }

        /* Search */
        .search-box {
            margin-bottom: 15px;
        }

        /* Task */
        .task-card {
            background: white;
            padding: 17px;
            margin-bottom: 13px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0,0,0,0.07);
            transition: 0.2s;
        }

        .task-card:hover {
            transform: translateY(-2px);
        }

        .task-info {
            display: flex;
            align-items: center;
            gap: 13px;
            flex: 1;
        }

        .task-info input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .task-title {
            font-size: 17px;
            font-weight: bold;
        }

        .completed .task-title {
            text-decoration: line-through;
            opacity: 0.5;
        }

        .task-details {
            font-size: 13px;
            margin-top: 5px;
            color: #777;
        }

        body.dark .task-details {
            color: #bbb;
        }

        .category {
            display: inline-block;
            padding: 3px 8px;
            background: #ede9fe;
            color: #5b21b6;
            border-radius: 10px;
            margin-left: 5px;
        }

        .actions {
            display: flex;
            gap: 7px;
        }

        .actions button {
            border: none;
            padding: 8px 10px;
            border-radius: 7px;
            cursor: pointer;
        }

        .edit {
            background: #facc15;
        }

        .delete {
            background: #ef4444;
            color: white;
        }

        /* Empty */
        .empty {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        /* Responsive */
        @media(max-width: 750px) {
            .input-row {
                grid-template-columns: 1fr;
            }

            .content {
                grid-template-columns: 1fr;
            }

            .task-card {
                align-items: flex-start;
                gap: 10px;
                flex-direction: column;
            }

            .actions {
                width: 100%;
            }

            .actions button {
                flex: 1;
            }

            header h1 {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>📋 My Task Manager</h1>
    <button id="darkMode">🌙 Dark Mode</button>
</header>

<div class="container">

    <!-- Add Task Form -->
    <div class="task-form">
        <h2>Add / Update Task</h2>

        <div class="input-row">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter task name..."
            >

            <select id="category">
                <option value="Personal">Personal</option>
                <option value="Work">Work</option>
                <option value="Study">Study</option>
                <option value="Shopping">Shopping</option>
                <option value="Other">Other</option>
            </select>

            <input type="datetime-local" id="taskDate">

        </div>

        <button class="add-btn" id="saveBtn" onclick="saveTask()">
            ➕ Add Task
        </button>
    </div>


    <!-- Main Content -->
    <div class="content">

        <!-- Sidebar -->
        <aside class="sidebar">

            <h3>Task Lists</h3>

            <button class="filter-btn active" onclick="filterTasks('all', this)">
                📋 All Tasks
            </button>

            <button class="filter-btn" onclick="filterTasks('pending', this)">
                ⏳ Pending
            </button>

            <button class="filter-btn" onclick="filterTasks('completed', this)">
                ✅ Completed
            </button>

            <button class="filter-btn" onclick="filterTasks('Personal', this)">
                👤 Personal
            </button>

            <button class="filter-btn" onclick="filterTasks('Work', this)">
                💼 Work
            </button>

            <button class="filter-btn" onclick="filterTasks('Study', this)">
                📚 Study
            </button>

            <button class="filter-btn" onclick="filterTasks('Shopping', this)">
                🛒 Shopping
            </button>

        </aside>


        <!-- Tasks -->
        <main>

            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="🔍 Search tasks..."
                    oninput="displayTasks()"
                >
            </div>

            <div id="taskList"></div>

        </main>

    </div>

</div>


<script>

    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

    let currentFilter = "all";
    let editIndex = -1;


    // Save Task
    function saveTask() {

        const taskInput = document.getElementById("taskInput");
        const category = document.getElementById("category");
        const taskDate = document.getElementById("taskDate");

        const title = taskInput.value.trim();

        if (title === "") {
            alert("Please enter a task!");
            return;
        }

        const task = {
            title: title,
            category: category.value,
            date: taskDate.value,
            completed: false
        };

        if (editIndex === -1) {

            tasks.push(task);

        } else {

            // Keep completed status when editing
            task.completed = tasks[editIndex].completed;
            tasks[editIndex] = task;

            editIndex = -1;

            document.getElementById("saveBtn").innerHTML =
                "➕ Add Task";
        }

        saveToStorage();
        clearForm();
        displayTasks();
    }


    // Display Tasks
    function displayTasks() {

        const list = document.getElementById("taskList");

        const search =
            document.getElementById("searchInput").value.toLowerCase();

        list.innerHTML = "";

        let filteredTasks = tasks.filter(task => {

            const matchesSearch =
                task.title.toLowerCase().includes(search);

            let matchesFilter = true;

            if (currentFilter === "pending") {
                matchesFilter = !task.completed;
            }

            else if (currentFilter === "completed") {
                matchesFilter = task.completed;
            }

            else if (
                currentFilter !== "all"
            ) {
                matchesFilter =
                    task.category === currentFilter;
            }

            return matchesSearch && matchesFilter;
        });


        if (filteredTasks.length === 0) {

            list.innerHTML = `
                <div class="empty">
                    <h3>📭 No tasks found</h3>
                    <p>Add a new task to get started.</p>
                </div>
            `;

            return;
        }


        filteredTasks.forEach((task) => {

            const realIndex = tasks.indexOf(task);

            const card = document.createElement("div");

            card.className =
                "task-card " +
                (task.completed ? "completed" : "");


            let formattedDate = "No date set";

            if (task.date) {

                formattedDate =
                    new Date(task.date).toLocaleString();
            }


            card.innerHTML = `

                <div class="task-info">

                    <input
                        type="checkbox"
                        ${task.completed ? "checked" : ""}
                        onchange="toggleTask(${realIndex})"
                    >

                    <div>

                        <div class="task-title">
                            ${escapeHTML(task.title)}
                        </div>

                        <div class="task-details">

                            📅 ${formattedDate}

                            <span class="category">
                                ${escapeHTML(task.category)}
                            </span>

                        </div>

                    </div>

                </div>


                <div class="actions">

                    <button
                        class="edit"
                        onclick="editTask(${realIndex})"
                    >
                        ✏️ Edit
                    </button>

                    <button
                        class="delete"
                        onclick="deleteTask(${realIndex})"
                    >
                        🗑️ Delete
                    </button>

                </div>
            `;

            list.appendChild(card);
        });
    }


    // Complete / Uncomplete Task
    function toggleTask(index) {

        tasks[index].completed =
            !tasks[index].completed;

        saveToStorage();
        displayTasks();
    }


    // Edit Task
    function editTask(index) {

        const task = tasks[index];

        document.getElementById("taskInput").value =
            task.title;

        document.getElementById("category").value =
            task.category;

        document.getElementById("taskDate").value =
            task.date;

        editIndex = index;

        document.getElementById("saveBtn").innerHTML =
            "💾 Update Task";

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }


    // Delete Task
    function deleteTask(index) {

        if (
            confirm("Are you sure you want to delete this task?")
        ) {

            tasks.splice(index, 1);

            saveToStorage();
            displayTasks();
        }
    }


    // Filter Tasks
    function filterTasks(filter, button) {

        currentFilter = filter;

        document
            .querySelectorAll(".filter-btn")
            .forEach(btn =>
                btn.classList.remove("active")
            );

        button.classList.add("active");

        displayTasks();
    }


    // Clear Form
    function clearForm() {

        document.getElementById("taskInput").value = "";
        document.getElementById("taskDate").value = "";

        editIndex = -1;

        document.getElementById("saveBtn").innerHTML =
            "➕ Add Task";
    }


    // Local Storage
    function saveToStorage() {

        localStorage.setItem(
            "tasks",
            JSON.stringify(tasks)
        );
    }


    // Prevent HTML injection
    function escapeHTML(text) {

        const div = document.createElement("div");

        div.textContent = text;

        return div.innerHTML;
    }


    // Dark Mode
    document
        .getElementById("darkMode")
        .addEventListener("click", function() {

            document.body.classList.toggle("dark");

            if (
                document.body.classList.contains("dark")
            ) {

                this.innerHTML = "☀️ Light Mode";

            } else {

                this.innerHTML = "🌙 Dark Mode";
            }
        });


    // Initial Display
    displayTasks();

</script>

</body>
</html>
